<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — Vivy AI</title>
<meta name="theme-color" content="#8b5cf6">
<link rel="icon" href="../icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .admin-row:last-child { border-bottom: none; }
  .admin-row label { flex: 1; font-size: 0.85rem; }
  .admin-row input { width: 120px; text-align: right; }
  .pack-row, .milestone-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .milestone-row { grid-template-columns: 1fr 1fr 1fr auto; }
</style>
</head>
<body>

<div class="page">
  <div class="top-header">
    <button class="btn-icon" onclick="location.href='../dashboard.html'"><span class="material-icons">arrow_back</span></button>
    <h1>🛠️ Admin</h1>
    <div style="width:40px;"></div>
  </div>

  <div id="access-denied" style="display:none;">
    <div class="card text-center">
      <span class="material-icons" style="font-size:36px;color:var(--error);">block</span>
      <h2 class="mt-8">Admin access required</h2>
      <p class="text-sm text-muted mt-8">Your account isn't on the admin allowlist.</p>
    </div>
  </div>

  <div id="admin-content" style="display:none;">
    <h3 class="mb-8">Credit Costs Per Feature</h3>
    <div class="card mb-16" id="costs-card"></div>

    <h3 class="mb-8">Free Plan Limits</h3>
    <div class="card mb-16" id="limits-card"></div>

    <h3 class="mb-8">Subscription Prices (₦)</h3>
    <div class="card mb-16" id="prices-card"></div>

    <h3 class="mb-8">Credit Packs</h3>
    <div class="card mb-16">
      <div id="packs-list"></div>
      <button class="btn btn-outline mt-8" onclick="addPackRow()"><span class="material-icons">add</span> Add Pack</button>
    </div>

    <h3 class="mb-8">Referral Milestones</h3>
    <div class="card mb-16">
      <p class="text-sm text-muted mb-8">rewardType is either "credits" or "premiumDays".</p>
      <div id="milestones-list"></div>
      <button class="btn btn-outline mt-8" onclick="addMilestoneRow()"><span class="material-icons">add</span> Add Milestone</button>
    </div>

    <button class="btn btn-primary" style="width:100%;" onclick="savePricing()">
      <span class="material-icons">save</span> Save Changes
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../utils.js"></script>
<script src="../auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
