<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Summarizer — Vivy AI</title>
<meta name="theme-color" content="#8b5cf6">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="top-header">
    <button class="btn-icon" onclick="location.href='dashboard.html'"><span class="material-icons">arrow_back</span></button>
    <h1>AI Summarizer</h1>
    <div style="width:40px;"></div>
  </div>

  <p class="text-sm mb-16">Paste any text and Vivy AI will condense it into a summary, bullet points, and key ideas.</p>

  <div class="card">
    <div class="form-group">
      <label class="form-label">Paste your text</label>
      <textarea class="form-textarea" id="sum-input" style="min-height:180px;" placeholder="Paste an article, notes, or any long text here..."></textarea>
    </div>
    <button class="btn btn-primary" id="sum-btn" onclick="runSummarize()">
      <span class="material-icons">summarize</span> Summarize
    </button>
  </div>

  <div class="card result-box mt-16" id="sum-result">
    <p class="text-muted text-sm">Your summary will appear here.</p>
  </div>
  <div class="result-actions" id="sum-actions" style="display:none;">
    <button class="btn btn-outline btn-sm" onclick="copySummary()"><span class="material-icons" style="font-size:16px;">content_copy</span> Copy</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" data-nav-link><span class="material-icons">dashboard</span>Home</a>
  <a href="chat.html" data-nav-link><span class="material-icons">chat</span>Chat</a>
  <a href="writer.html" data-nav-link><span class="material-icons">edit_note</span>Writer</a>
  <a href="history.html" data-nav-link><span class="material-icons">history</span>History</a>
  <a href="settings.html" data-nav-link><span class="material-icons">settings</span>Settings</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="utils.js"></script>
<script src="auth.js"></script>
<script>
  let sumUser = null;
  (async function initSummarizer() { sumUser = await requireAuth(); })();

  async function runSummarize() {
    const text = cleanText(document.getElementById("sum-input").value, 12000);
    if (!text) { showNotification("warning", "Please paste some text first."); return; }

    const profile = await VivyUser.ensureDailyReset(sumUser.uid);
    if (VivyUser.remaining(profile) <= 0) {
      showNotification("warning", "Daily AI limit reached. Upgrade to Premium for unlimited use.");
      return;
    }

    const btn = document.getElementById("sum-btn");
    const resultBox = document.getElementById("sum-result");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Summarizing...`;
    resultBox.innerHTML = `<div class="skeleton skeleton-line" style="width:90%;"></div><div class="skeleton skeleton-line" style="width:70%;"></div>`;

    try {
      const summary = await VivyAI.generate({ task: "summarize", prompt: text });
      resultBox.innerHTML = markdownToHtml(summary);
      resultBox.dataset.raw = summary;
      document.getElementById("sum-actions").style.display = "flex";
      await VivyUser.incrementUsage(sumUser.uid);
      await db.collection("users").doc(sumUser.uid).collection("history").add({
        type: "summarizer", title: "Summary: " + text.slice(0, 30), content: summary,
        pinned: false, favorite: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (e) {
      showNotification("error", "Summarization failed. Please try again.");
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<span class="material-icons">summarize</span> Summarize`;
    }
  }

  function copySummary() {
    const raw = document.getElementById("sum-result").dataset.raw || "";
    navigator.clipboard.writeText(raw).then(() => showNotification("success", "Copied to clipboard"));
  }
</script>
</body>
</html>
