name: Build Vivy AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Vivy AI APK
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Get the Vivy AI source code
      # --------------------------------------------------
      - name: Checkout Vivy AI
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # Bubblewrap requires JDK 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Install Android SDK components
      # --------------------------------------------------
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 6. Install Expect
      # Used only to answer Bubblewrap's init questions
      # --------------------------------------------------
      - name: Install Expect
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      # --------------------------------------------------
      # 7. Install Bubblewrap
      #
      # IMPORTANT:
      # Do NOT run "bubblewrap --version" before configuring
      # the environment.
      # --------------------------------------------------
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.24.1

      # --------------------------------------------------
      # 8. Configure Bubblewrap BEFORE its first command
      #
      # This prevents the JDK/Android SDK question that
      # caused the previous GitHub Actions failure.
      # --------------------------------------------------
      - name: Configure Bubblewrap environment
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      # --------------------------------------------------
      # 9. Check Java + Android SDK
      # --------------------------------------------------
      - name: Check Bubblewrap environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          bubblewrap doctor

      # --------------------------------------------------
      # 10. Restore YOUR existing signing key
      # --------------------------------------------------
      - name: Restore Vivy signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIVY_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android

          echo "$KEYSTORE_B64" | base64 --decode > android/vivyai.jks

          test -s android/vivyai.jks

          echo "Signing key restored."

      # --------------------------------------------------
      # 11. Verify the signing key
      # --------------------------------------------------
      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
        run: |
          keytool \
            -list \
            -keystore android/vivyai.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias vivyai

      # --------------------------------------------------
      # 12. Generate Android TWA project
      #
      # Bubblewrap init is interactive, so Expect answers
      # the questions automatically.
      # --------------------------------------------------
      - name: Generate Android project
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |

          cat > init.expect <<'EXPECT'
          set timeout 300

          spawn bubblewrap init \
            --manifest="https://vivy.name.ng/manifest.json" \
            --directory="./android"

          expect {
            -re "Domain being opened in the TWA" {
              send "vivy.name.ng\r"
              exp_continue
            }

            -re "Name of the application" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "Name to be shown on the Android Launcher" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "Color to be used for the status bar" {
              send "#8b5cf6\r"
              exp_continue
            }

            -re "Color to be used for the splash screen background" {
              send "#0f0a1f\r"
              exp_continue
            }

            -re "Relative path to open the TWA" {
              send "/index.html\r"
              exp_continue
            }

            -re "URL to an image that is at least 512x512px" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "URL to an image that is at least 512x512px.*maskable" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "Include app shortcuts" {
              send "n\r"
              exp_continue
            }

            -re "Android Package Name" {
              send "ng.name.vivy.twa\r"
              exp_continue
            }

            -re "Location of the Signing Key" {
              send "./vivyai.jks\r"
              exp_continue
            }

            -re "Key name" {
              send "vivyai\r"
              exp_continue
            }

            -re "Signing Key could not be found" {
              send "n\r"
              exp_continue
            }

            eof
          }

          catch wait result

          set exit_code [lindex $result 3]

          if {$exit_code != 0} {
            puts "Bubblewrap init failed."
            exit $exit_code
          }

          puts "Bubblewrap project generated successfully."
          EXPECT

          expect init.expect

      # --------------------------------------------------
      # 13. Confirm project exists
      # --------------------------------------------------
      - name: Check Android project
        run: |
          test -f android/twa-manifest.json
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project:"
          find android -maxdepth 2 -type f | head -50

      # --------------------------------------------------
      # 14. Build + sign APK
      # --------------------------------------------------
      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="./vivyai.jks" \
            --signingKeyAlias="vivyai"

      # --------------------------------------------------
      # 15. Find the generated APK
      # --------------------------------------------------
      - name: Locate APK
        id: apk
        run: |
          APK="android/app-release-signed.apk"

          if [ ! -f "$APK" ]; then
            echo "Expected signed APK was not created."

            echo "Searching for APK files:"
            find android -type f -name "*.apk" -print

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

      # --------------------------------------------------
      # 16. Verify Android signature
      # --------------------------------------------------
      - name: Verify APK signature
        run: |
          apksigner verify \
            --verbose \
            android/app-release-signed.apk

      # --------------------------------------------------
      # 17. Verify APK is a valid ZIP/APK
      # --------------------------------------------------
      - name: Verify APK integrity
        run: |
          unzip -t android/app-release-signed.apk

      # --------------------------------------------------
      # 18. Upload final APK
      # --------------------------------------------------
      - name: Upload Vivy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivy-AI-installable-APK
          path: android/app-release-signed.apk
          if-no-files-found: error
