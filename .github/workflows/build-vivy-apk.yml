name: Build Vivy AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Vivy AI APK
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Vivy AI
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Node 20
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Android SDK components
      # --------------------------------------------------
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 6. Expect
      # --------------------------------------------------
      - name: Install Expect
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      # --------------------------------------------------
      # 7. Install Bubblewrap
      #
      # Do NOT invoke `bubblewrap` here (not even --version).
      # Its first-ever invocation on a fresh runner triggers
      # an interactive JDK/SDK setup wizard if
      # ~/.bubblewrap/config.json does not exist yet.
      # --------------------------------------------------
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.24.1

      # --------------------------------------------------
      # 8. Configure Bubblewrap BEFORE any bubblewrap command
      # --------------------------------------------------
      - name: Configure Bubblewrap environment
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      # --------------------------------------------------
      # 9. Check environment
      #
      # First real bubblewrap invocation in this workflow.
      # Config already exists, so no interactive prompt fires.
      # --------------------------------------------------
      - name: Check Bubblewrap environment
        run: |
          echo "Java:"; java -version
          echo; echo "Node:"; node --version
          echo; echo "npm:"; npm --version
          echo; echo "Bubblewrap:"; bubblewrap --version
          echo; echo "JAVA_HOME:"; echo "$JAVA_HOME"
          echo; echo "ANDROID_HOME:"; echo "$ANDROID_HOME"

      # --------------------------------------------------
      # 10. Create the android/ directory FIRST
      # --------------------------------------------------
      - name: Create android directory
        run: mkdir -p android

      # --------------------------------------------------
      # 11. Restore existing Vivy signing key into android/
      # --------------------------------------------------
      - name: Restore Vivy signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIVY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" | base64 --decode > android/vivyai.jks

          test -s android/vivyai.jks
          chmod 600 android/vivyai.jks

          echo "Signing key restored."
          ls -lh android/vivyai.jks

      # --------------------------------------------------
      # 12. Verify the existing signing key
      # --------------------------------------------------
      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
        run: |
          keytool \
            -list \
            -keystore android/vivyai.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias vivyai

          echo "Signing key verification passed."

      # --------------------------------------------------
      # 13. Generate Android project
      #
      # Runs FROM INSIDE the already-existing android/
      # directory with NO --directory flag, so Bubblewrap
      # never has to decide whether to create a directory —
      # it just uses ".", which already exists.
      # --------------------------------------------------
      - name: Generate Android project
        working-directory: android
        env:
          TERM: dumb
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          cat > init.expect <<'EXPECT'
          set timeout 600
          log_user 1

          spawn bubblewrap init --manifest="https://vivy.name.ng/manifest.json"

          expect {

            -re "(?i)Domain.*" {
              send "vivy.name.ng\r"
              exp_continue
            }

            -re "(?i)(Application name|Name of the application).*" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "(?i)Name to be shown on the Android Launcher.*" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "(?i)Color to be used for the status bar.*" {
              send "#8b5cf6\r"
              exp_continue
            }

            -re "(?i)Color to be used for the splash screen background.*" {
              send "#0f0a1f\r"
              exp_continue
            }

            -re "(?i)Relative path to open the TWA.*" {
              send "\r"
              exp_continue
            }

            -re "(?i)maskable.*512x512.*" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)URL to an image that is at least 512x512.*" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)Include app shortcuts.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i)Android Package Name.*" {
              send "ng.name.vivy.twa\r"
              exp_continue
            }

            -re "(?i)Location of the Signing Key.*" {
              send "./vivyai.jks\r"
              exp_continue
            }

            -re "(?i)Key (name|alias).*" {
              send "vivyai\r"
              exp_continue
            }

            -re "(?i)(Signing Key could not be found|Do you want to create).*" {
              send "n\r"
              exp_continue
            }

            -re "(?i)key\s*store password.*" {
              send "$env(KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -re "(?i)key password.*" {
              send "$env(KEY_PASSWORD)\r"
              exp_continue
            }

            eof
          }

          catch wait result
          set exit_code [lindex $result 3]

          if {$exit_code != 0} {
            puts "Bubblewrap init failed with exit code $exit_code."
            exit $exit_code
          }

          puts "Bubblewrap init completed."
          EXPECT

          timeout 600 expect init.expect

      # --------------------------------------------------
      # 14. Verify generated Android project
      # --------------------------------------------------
      - name: Verify Android project
        run: |
          test -f android/twa-manifest.json
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project generated successfully."
          find android -maxdepth 2 -type f | sort | head -100

      # --------------------------------------------------
      # 15. Build signed APK
      # --------------------------------------------------
      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="./vivyai.jks" \
            --signingKeyAlias="vivyai"

      # --------------------------------------------------
      # 16. Locate APK
      # --------------------------------------------------
      - name: Locate APK
        run: |
          APK="$(find android -type f -name "app-release-signed.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: app-release-signed.apk was not found."
            find android -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 17. Verify APK signature
      # --------------------------------------------------
      - name: Verify APK signature
        run: |
          apksigner verify --verbose "$APK_PATH"

      # --------------------------------------------------
      # 18. Verify APK ZIP integrity
      # --------------------------------------------------
      - name: Verify APK integrity
        run: |
          unzip -t "$APK_PATH"

      # --------------------------------------------------
      # 19. Verify AndroidManifest.xml exists inside the APK
      # --------------------------------------------------
      - name: Verify AndroidManifest.xml
        run: |
          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"
          echo "AndroidManifest.xml confirmed inside APK."

      # --------------------------------------------------
      # 20. Upload APK artifact
      # --------------------------------------------------
      - name: Upload Vivy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivy-AI-installable-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
