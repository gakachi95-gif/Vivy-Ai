name: Build Vivy AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Vivy AI APK
    runs-on: ubuntu-22.04

    steps:

      # 1. Checkout
      - name: Checkout Vivy AI
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Node 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Android SDK components
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Expect
      - name: Install Expect
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      # 7. Install Bubblewrap 1.24.1
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.24.1

      # 8. Configure Bubblewrap
      - name: Configure Bubblewrap
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          printf '%s\n' \
            '{' \
            "  \"jdkPath\": \"$JAVA_HOME\"," \
            "  \"androidSdkPath\": \"$ANDROID_HOME\"" \
            '}' \
            > "$HOME/.bubblewrap/config.json"

          echo "HOME=$HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/jarsigner"
          test -x "$ANDROID_HOME/platform-tools/adb"

      # 9. Restore existing signing key
      - name: Restore Vivy signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIVY_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > vivyai.jks

          test -s vivyai.jks

          chmod 600 vivyai.jks

          echo "Signing key restored:"
          ls -lh vivyai.jks

      # 10. Verify signing key
      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
        run: |
          set -e

          keytool \
            -list \
            -keystore vivyai.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias vivyai

          echo "Signing key verification PASSED."

      # 11. Generate Android project
      #
      # IMPORTANT:
      # android/ is deliberately removed first.
      #
      # Bubblewrap receives --directory=./android.
      #
      # Expect handles:
      # - JDK installation question
      # - JDK path
      # - Android SDK installation question
      # - Android SDK path
      # - Android directory creation
      # - all normal TWA questions
      # - existing signing key
      #
      - name: Generate Android project
        env:
          TERM: dumb
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          set -e

          rm -rf android

          cat > init.expect <<'EXPECT'
          set timeout 900
          log_user 1

          spawn bubblewrap init \
            --manifest="https://vivy.name.ng/manifest.json" \
            --directory="./android"

          expect {

            # ------------------------------------------------
            # Bubblewrap dependency questions
            # ------------------------------------------------

            -re {(?i).*install.*JDK.*\([Rr]ecommended\).*} {
              send "n\r"
              exp_continue
            }

            -re {(?i).*Path to.*JDK.*} {
              send "$env(JAVA_HOME)\r"
              exp_continue
            }

            -re {(?i).*install.*Android SDK.*\([Rr]ecommended\).*} {
              send "n\r"
              exp_continue
            }

            -re {(?i).*Path to.*Android SDK.*} {
              send "$env(ANDROID_HOME)\r"
              exp_continue
            }

            # ------------------------------------------------
            # Android output directory
            # ------------------------------------------------

            -re {(?i).*Directory.*does not exist.*} {
              send "y\r"
              exp_continue
            }

            -re {(?i).*Do you want to create.*directory.*} {
              send "y\r"
              exp_continue
            }

            # ------------------------------------------------
            # Web manifest / TWA information
            # ------------------------------------------------

            -re {(?i).*Domain being opened in the TWA.*} {
              send "vivy.name.ng\r"
              exp_continue
            }

            -re {(?i).*Name of the application.*} {
              send "Vivy AI\r"
              exp_continue
            }

            -re {(?i).*Name to be shown on the Android Launcher.*} {
              send "Vivy AI\r"
              exp_continue
            }

            -re {(?i).*Color to be used for the status bar.*} {
              send "#8b5cf6\r"
              exp_continue
            }

            -re {(?i).*Color to be used for the splash screen background.*} {
              send "#0f0a1f\r"
              exp_continue
            }

            -re {(?i).*Relative path to open the TWA.*} {
              send "/index.html\r"
              exp_continue
            }

            -re {(?i).*URL to an image that is at least 512x512px.*maskable.*} {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re {(?i).*URL to an image that is at least 512x512px.*} {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re {(?i).*Include app shortcuts.*} {
              send "n\r"
              exp_continue
            }

            # ------------------------------------------------
            # Package
            # ------------------------------------------------

            -re {(?i).*Android Package Name.*} {
              send "ng.name.vivy.twa\r"
              exp_continue
            }

            # ------------------------------------------------
            # Existing signing key
            # ------------------------------------------------

            -re {(?i).*Key store location.*} {
              send "./vivyai.jks\r"
              exp_continue
            }

            -re {(?i).*Location of the Signing Key.*} {
              send "./vivyai.jks\r"
              exp_continue
            }

            -re {(?i).*Key name.*} {
              send "vivyai\r"
              exp_continue
            }

            -re {(?i).*Key alias.*} {
              send "vivyai\r"
              exp_continue
            }

            # ------------------------------------------------
            # Never create a new key
            # ------------------------------------------------

            -re {(?i).*Do you want to create.*keystore.*} {
              send "n\r"
              exp_continue
            }

            -re {(?i).*Signing Key could not be found.*} {
              send "n\r"
              exp_continue
            }

            # ------------------------------------------------
            # Password questions, if init asks them
            # ------------------------------------------------

            -re {(?i).*Password for the Key Store.*} {
              send "$env(KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -re {(?i).*Password for the Key.*} {
              send "$env(KEY_PASSWORD)\r"
              exp_continue
            }

            -re {(?i).*key store password.*} {
              send "$env(KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -re {(?i).*key password.*} {
              send "$env(KEY_PASSWORD)\r"
              exp_continue
            }

            # ------------------------------------------------
            # Final success
            # ------------------------------------------------

            -re {(?i).*Project generated successfully.*} {
              exp_continue
            }

            -re {(?i).*Project generated.*} {
              exp_continue
            }

            eof
          }

          catch wait result

          set exit_code [lindex $result 3]

          puts ""
          puts "Bubblewrap init exit code: $exit_code"

          if {$exit_code != 0} {
            puts "Bubblewrap initialization FAILED."
            exit $exit_code
          }

          puts "Bubblewrap initialization PASSED."
          EXPECT

          expect init.expect

      # 12. Verify Android project
      - name: Verify Android project
        run: |
          set -e

          echo "Checking generated Android project..."

          test -d android
          test -f android/twa-manifest.json
          test -f android/gradlew
          test -f android/app/build.gradle

          echo ""
          echo "Android project generated successfully."

          echo ""
          echo "Important files:"
          find android -maxdepth 2 -type f | sort | head -100

      # 13. Build signed APK
      #
      # Bubblewrap officially supports these CI environment
      # variables and signing flags.
      #
      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="../vivyai.jks" \
            --signingKeyAlias="vivyai"

      # 14. Locate signed APK
      - name: Locate signed APK
        run: |
          set -e

          echo "Searching for generated APK..."

          find android -type f -name "*.apk" -print

          APK="$(find android -type f -name "app-release-signed.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Signed APK was not found."
            echo ""
            echo "Available APK files:"
            find android -type f -name "*.apk" -print
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK exists but is empty."
            exit 1
          fi

          echo ""
          echo "SIGNED APK FOUND:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 15. Verify APK signature
      - name: Verify APK signature
        run: |
          set -e

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -x "$APKSIGNER"

          echo "Verifying APK:"
          echo "$APK_PATH"

          "$APKSIGNER" verify \
            --verbose \
            "$APK_PATH"

          echo "APK SIGNATURE VERIFIED."

      # 16. Verify APK integrity
      - name: Verify APK integrity
        run: |
          set -e

          test -s "$APK_PATH"

          unzip -t "$APK_PATH" >/dev/null

          unzip -l "$APK_PATH" \
            | grep -q "AndroidManifest.xml"

          echo "APK ZIP integrity PASSED."
          echo "AndroidManifest.xml FOUND."

      # 17. Show APK information
      - name: APK information
        run: |
          echo "========================================"
          echo "VIVY AI APK"
          echo "========================================"

          ls -lh "$APK_PATH"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK_PATH"

      # 18. Upload APK
      - name: Upload Vivy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivy-AI-installable-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
