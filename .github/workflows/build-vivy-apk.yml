name: Build Vivy AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vivy AI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Bubblewrap 1.24.1
        run: |
          npm install -g @bubblewrap/cli@1.24.1
          bubblewrap --version

      - name: Configure Bubblewrap
        run: |
          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME"

          bubblewrap doctor

      - name: Restore Vivy AI signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIVY_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android

          echo "$KEYSTORE_B64" | base64 --decode > android/vivyai.jks

          test -s android/vivyai.jks

          echo "Signing key restored successfully."

      - name: Generate Android project
        run: |
          mkdir -p android

          cat > /tmp/init.expect <<'EXPECT'
          set timeout 180

          spawn bubblewrap init \
            --manifest "https://vivy.name.ng/manifest.json" \
            --directory "android"

          expect {
            -re "Do you want Bubblewrap to install JDK" {
              send "n\r"
              exp_continue
            }

            -re "Path to your existing JDK" {
              send "$env(JAVA_HOME)\r"
              exp_continue
            }

            -re "Do you want Bubblewrap to install.*Android SDK" {
              send "n\r"
              exp_continue
            }

            -re "Path to your existing Android SDK" {
              send "$env(ANDROID_HOME)\r"
              exp_continue
            }

            -re "Domain being opened in the TWA" {
              send "vivy.name.ng\r"
              exp_continue
            }

            -re "Name of the application" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "Name to be shown on the Android Launcher" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "Color to be used for the status bar" {
              send "#8b5cf6\r"
              exp_continue
            }

            -re "Color to be used for the splash screen background" {
              send "#0f0a1f\r"
              exp_continue
            }

            -re "Relative path to open the TWA" {
              send "/index.html\r"
              exp_continue
            }

            -re "URL to an image that is at least 512x512px" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "URL to an image that is at least 512x512px.*maskable" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "Include app shortcuts" {
              send "n\r"
              exp_continue
            }

            -re "Android Package Name.*Application ID" {
              send "ng.name.vivy.twa\r"
              exp_continue
            }

            -re "Location of the Signing Key" {
              send "./vivyai.jks\r"
              exp_continue
            }

            -re "Key name" {
              send "vivyai\r"
              exp_continue
            }

            -re "Signing Key could not be found" {
              send "n\r"
              exp_continue
            }

            -re "Do you want to enable.*notification" {
              send "y\r"
              exp_continue
            }

            -re "Do you want to enable.*Play Billing" {
              send "n\r"
              exp_continue
            }

            -re "Do you want to enable.*Location" {
              send "n\r"
              exp_continue
            }

            -re "Do you want to enable.*AppsFlyer" {
              send "n\r"
              exp_continue
            }

            eof
          }

          catch wait result

          if {[lindex $result 3] != 0} {
            puts "Bubblewrap init failed."
            exit [lindex $result 3]
          }
          EXPECT

          sudo apt-get update -y
          sudo apt-get install -y expect

          export JAVA_HOME="$JAVA_HOME"
          export ANDROID_HOME="$ANDROID_HOME"

          expect /tmp/init.expect

      - name: Check generated project
        run: |
          test -f android/twa-manifest.json
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project generated successfully."

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build signed Vivy AI APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="./vivyai.jks" \
            --signingKeyAlias="vivyai"

      - name: Verify APK
        run: |
          test -s android/app-release-signed.apk

          apksigner verify \
            --verbose \
            android/app-release-signed.apk

          unzip -t android/app-release-signed.apk

          ls -lh android/app-release-signed.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivy-AI-installable-APK
          path: android/app-release-signed.apk
          if-no-files-found: error
