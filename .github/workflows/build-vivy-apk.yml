name: Build Vivy AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Vivy AI APK
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Vivy AI
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Node 20
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Android SDK components
      # --------------------------------------------------
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 6. Expect
      # --------------------------------------------------
      - name: Install Expect
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      # --------------------------------------------------
      # 7. Install Bubblewrap
      # --------------------------------------------------
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.24.1

          echo "Bubblewrap version:"
          bubblewrap --version

      # --------------------------------------------------
      # 8. Configure Bubblewrap
      # --------------------------------------------------
      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      # --------------------------------------------------
      # 9. Check environment
      # --------------------------------------------------
      - name: Check build environment
        run: |
          echo "Java:"
          java -version

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Bubblewrap:"
          bubblewrap --version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

      # --------------------------------------------------
      # 10. Restore existing Vivy signing key
      #
      # IMPORTANT:
      # Keep the key OUTSIDE the android directory while
      # Bubblewrap init is creating that directory.
      # --------------------------------------------------
      - name: Restore Vivy signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIVY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" | base64 --decode > vivyai.jks

          test -s vivyai.jks

          chmod 600 vivyai.jks

          echo "Signing key restored."

          ls -lh vivyai.jks

      # --------------------------------------------------
      # 11. Verify existing signing key
      # --------------------------------------------------
      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
        run: |
          keytool \
            -list \
            -keystore vivyai.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias vivyai

          echo "Signing key verification passed."

      # --------------------------------------------------
      # 12. Generate Android project
      #
      # Bubblewrap init is interactive.
      # Expect answers every required question.
      # --------------------------------------------------
      - name: Generate Android project
        env:
          TERM: dumb
        run: |

          rm -rf android

          cat > init.expect <<'EXPECT'
          set timeout 600

          log_user 1

          spawn bubblewrap init \
            --manifest="https://vivy.name.ng/manifest.json" \
            --directory="./android"

          expect {
            
            -re "(?i)Directory .* does not exist.*Do you want to create it.*" {
              send "y\r"
              exp_continue
            }

            -re "(?i)Domain.*" {
              send "vivy.name.ng\r"
              exp_continue
            }

            -re "(?i)Application name.*" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "(?i)Name of the application.*" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "(?i)Name to be shown on the Android Launcher.*" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "(?i)Color to be used for the status bar.*" {
              send "#8b5cf6\r"
              exp_continue
            }

            -re "(?i)Color to be used for the splash screen background.*" {
              send "#0f0a1f\r"
              exp_continue
            }

            -re "(?i)Relative path to open the TWA.*" {
              send "/index.html\r"
              exp_continue
            }

            -re "(?i)URL to an image that is at least 512x512.*" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)maskable.*512x512.*" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)Include app shortcuts.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i)Android Package Name.*" {
              send "ng.name.vivy.twa\r"
              exp_continue
            }

            -re "(?i)Location of the Signing Key.*" {
              send "./vivyai.jks\r"
              exp_continue
            }

            -re "(?i)Key name.*" {
              send "vivyai\r"
              exp_continue
            }

            -re "(?i)Signing Key could not be found.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i)Do you want to create.*keystore.*" {
              send "n\r"
              exp_continue
            }

            eof
          }

          catch wait result

          set exit_code [lindex $result 3]

          if {$exit_code != 0} {
            puts "Bubblewrap init failed with exit code $exit_code."
            exit $exit_code
          }

          puts "Bubblewrap init completed."

          EXPECT

          expect init.expect

      # --------------------------------------------------
      # 13. Verify generated Android project
      # --------------------------------------------------
      - name: Verify Android project
        run: |
          echo "Checking Android project..."

          test -d android
          test -f android/twa-manifest.json
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project generated successfully."

          echo
          echo "Project files:"
          find android -maxdepth 2 -type f | sort | head -100

      # --------------------------------------------------
      # 14. Build signed APK
      # --------------------------------------------------
      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="../vivyai.jks" \
            --signingKeyAlias="vivyai"

      # --------------------------------------------------
      # 15. Locate APK
      # --------------------------------------------------
      - name: Locate APK
        id: locate_apk
        run: |
          echo "Searching for generated APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find android \
            -type f \
            -name "app-release-signed.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Signed APK was not found."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 16. Verify APK signature
      # --------------------------------------------------
      - name: Verify APK signature
        run: |
          echo "Verifying APK signature..."

          apksigner verify \
            --verbose \
            "$APK_PATH"

      # --------------------------------------------------
      # 17. Verify APK integrity
      # --------------------------------------------------
      - name: Verify APK integrity
        run: |
          echo "Testing APK ZIP integrity..."

          unzip -t "$APK_PATH"

          echo "APK integrity check passed."

      # --------------------------------------------------
      # 18. Display APK information
      # --------------------------------------------------
      - name: APK information
        run: |
          echo "Final APK:"
          ls -lh "$APK_PATH"

          echo
          echo "APK SHA-256:"
          sha256sum "$APK_PATH"

      # --------------------------------------------------
      # 19. Upload APK artifact
      # --------------------------------------------------
      - name: Upload Vivy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivy-AI-installable-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
