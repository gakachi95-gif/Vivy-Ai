name: Build Vivy AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vivy AI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create TWA manifest
        run: |
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "ng.name.vivy.twa",
            "host": "vivy.name.ng",
            "name": "Vivy AI",
            "launcherName": "Vivy AI",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#8b5cf6",
            "themeColorDark": "#8b5cf6",
            "navigationColor": "#8b5cf6",
            "navigationColorDark": "#8b5cf6",
            "navigationDividerColor": "#8b5cf6",
            "navigationDividerColorDark": "#8b5cf6",
            "backgroundColor": "#0f0a1f",
            "startUrl": "/index.html",
            "iconUrl": "https://vivy.name.ng/icons/icon-512.png",
            "maskableIconUrl": "https://vivy.name.ng/icons/icon-512.png",
            "webManifestUrl": "https://vivy.name.ng/manifest.json",
            "splashScreenFadeOutDuration": 300,
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 23,
            "enableNotifications": true,
            "enableSiteSettingsShortcut": true,
            "isMetaQuest": false,
            "isChromeOSOnly": false,
            "fallbackType": "customtabs",
            "shortcuts": [],
            "additionalTrustedOrigins": [],
            "generatorApp": "bubblewrap-cli",
            "fingerprints": []
          }
          EOF

      - name: Generate Android project
        run: |
          mkdir -p android
          cd android
          bubblewrap init --manifest ../twa-manifest.json --directory .

      - name: Restore Vivy signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIVY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/vivyai.jks
          test -s android/vivyai.jks

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "No release APK found."
            exit 1
          fi

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks android/vivyai.jks \
            --ks-key-alias vivyai \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out Vivy-AI-signed.apk \
            "$APK"

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose Vivy-AI-signed.apk
          unzip -t Vivy-AI-signed.apk
          ls -lh Vivy-AI-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivy-AI-signed-APK
          path: Vivy-AI-signed.apk
          if-no-files-found: error
