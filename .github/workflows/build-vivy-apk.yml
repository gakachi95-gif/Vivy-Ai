name: Build Vivy AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vivy AI
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap configuration
        run: |
          mkdir -p android

          cat > android/twa-manifest.json <<'EOF'
          {
            "packageId": "ng.name.vivy.twa",
            "host": "vivy.name.ng",
            "name": "Vivy AI",
            "launcherName": "Vivy AI",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#8b5cf6",
            "themeColorDark": "#8b5cf6",
            "navigationColor": "#8b5cf6",
            "navigationColorDark": "#8b5cf6",
            "navigationDividerColor": "#8b5cf6",
            "navigationDividerColorDark": "#8b5cf6",
            "backgroundColor": "#0f0a1f",
            "enableNotifications": true,
            "enableSiteSettingsShortcut": true,
            "startUrl": "/index.html",
            "iconUrl": "https://vivy.name.ng/icons/icon-512.png",
            "maskableIconUrl": "https://vivy.name.ng/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 23,
            "signingKey": {
              "path": "./vivyai.jks",
              "alias": "vivyai"
            },
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://vivy.name.ng/manifest.json",
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "fingerprints": [],
            "additionalTrustedOrigins": []
          }
          EOF

      - name: Generate Android project
        run: |
          bubblewrap update --manifest=android

      - name: Install existing Vivy AI signing key
        env:
          VIVY_KEYSTORE_BASE64: ${{ secrets.VIVY_KEYSTORE_BASE64 }}
        run: |
          echo "$VIVY_KEYSTORE_BASE64" | base64 --decode > android/vivyai.jks
          test -s android/vivyai.jks
          ls -lh android/vivyai.jks

      - name: Build unsigned APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find android -type f -name "*.apk" -print

      - name: Sign APK with Vivy AI key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "Signing: $APK"

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks android/vivyai.jks \
            --ks-key-alias vivyai \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out android/app-release-signed.apk \
            "$APK"

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app-release-signed.apk

          unzip -t android/app-release-signed.apk

          test -s android/app-release-signed.apk

          ls -lh android/app-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivy-AI-APK
          path: android/app-release-signed.apk
          if-no-files-found: error
