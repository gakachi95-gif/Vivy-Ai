name: Build Vivy AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Vivy AI APK
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Vivy AI
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Node 20
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Android SDK components
      # --------------------------------------------------
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 6. Expect
      # --------------------------------------------------
      - name: Install Expect
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      # --------------------------------------------------
      # 7. Install Bubblewrap
      #
      # IMPORTANT FIX:
      # Do NOT invoke `bubblewrap` (even --version) here.
      # Bubblewrap's very first invocation on a runner
      # triggers an interactive "install JDK?" wizard if
      # ~/.bubblewrap/config.json does not exist yet. That
      # config is only written in the next step. Calling
      # bubblewrap here (as the previous workflow did) is
      # exactly what caused Build #5 to hang and fail with
      # exit code 130.
      # --------------------------------------------------
      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.24.1
          echo "Bubblewrap CLI installed (version check deferred until after config is written)."

      # --------------------------------------------------
      # 8. Configure Bubblewrap
      #
      # This MUST run, and this config file MUST exist,
      # before the first real invocation of the bubblewrap
      # command anywhere else in this workflow.
      # --------------------------------------------------
      - name: Configure Bubblewrap environment
        run: |
          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      # --------------------------------------------------
      # 9. Check environment
      #
      # This is now the FIRST time `bubblewrap` is actually
      # invoked in this workflow. Config already exists, so
      # no interactive JDK/SDK prompt should appear.
      # --------------------------------------------------
      - name: Check Bubblewrap environment
        run: |
          echo "Java:"
          java -version

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "Bubblewrap:"
          bubblewrap --version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"

      # --------------------------------------------------
      # 10. Restore existing Vivy signing key
      # --------------------------------------------------
      - name: Restore Vivy signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIVY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"

          echo "$KEYSTORE_B64" | base64 --decode > vivyai.jks

          test -s vivyai.jks

          chmod 600 vivyai.jks

          echo "Signing key restored."
          ls -lh vivyai.jks

      # --------------------------------------------------
      # 11. Verify existing signing key
      # --------------------------------------------------
      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
        run: |
          keytool \
            -list \
            -keystore vivyai.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias vivyai

          echo "Signing key verification passed."

      # --------------------------------------------------
      # 12. Generate Android project
      #
      # FIX for Build #4: create ./android BEFORE bubblewrap
      # init runs, so the "directory does not exist, create
      # it?" prompt structurally cannot occur. The Expect
      # patterns are kept as a defensive fallback for any
      # other prompt, wrapped in a hard `timeout` so the job
      # can never hang indefinitely.
      # --------------------------------------------------
      - name: Generate Android project
        env:
          TERM: dumb
        run: |
          rm -rf android
          mkdir -p android

          cat > init.expect <<'EXPECT'
          set timeout 600

          log_user 1

          spawn bubblewrap init \
            --manifest="https://vivy.name.ng/manifest.json" \
            --directory="./android"

          expect {

            -re "(?i)Directory .* does not exist.*Do you want to create it.*" {
              send "y\r"
              exp_continue
            }

            -re "(?i)Domain.*" {
              send "vivy.name.ng\r"
              exp_continue
            }

            -re "(?i)Application name.*" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "(?i)Name of the application.*" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "(?i)Name to be shown on the Android Launcher.*" {
              send "Vivy AI\r"
              exp_continue
            }

            -re "(?i)Color to be used for the status bar.*" {
              send "#8b5cf6\r"
              exp_continue
            }

            -re "(?i)Color to be used for the splash screen background.*" {
              send "#0f0a1f\r"
              exp_continue
            }

            -re "(?i)Relative path to open the TWA.*" {
              send "/index.html\r"
              exp_continue
            }

            -re "(?i)URL to an image that is at least 512x512.*" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)maskable.*512x512.*" {
              send "https://vivy.name.ng/icons/icon-512.png\r"
              exp_continue
            }

            -re "(?i)Include app shortcuts.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i)Android Package Name.*" {
              send "ng.name.vivy.twa\r"
              exp_continue
            }

            -re "(?i)Location of the Signing Key.*" {
              send "./vivyai.jks\r"
              exp_continue
            }

            -re "(?i)Key name.*" {
              send "vivyai\r"
              exp_continue
            }

            -re "(?i)Signing Key could not be found.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i)Do you want to create.*keystore.*" {
              send "n\r"
              exp_continue
            }

            eof
          }

          catch wait result

          set exit_code [lindex $result 3]

          if {$exit_code != 0} {
            puts "Bubblewrap init failed with exit code $exit_code."
            exit $exit_code
          }

          puts "Bubblewrap init completed."

          EXPECT

          timeout 600 expect init.expect

      # --------------------------------------------------
      # 13. Verify generated Android project
      # --------------------------------------------------
      - name: Verify Android project
        run: |
          echo "Checking Android project..."

          test -d android
          test -f android/twa-manifest.json
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project generated successfully."

          echo
          echo "Project files:"
          find android -maxdepth 2 -type f | sort | head -100

      # --------------------------------------------------
      # 14. Build signed APK
      # --------------------------------------------------
      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.VIVY_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.VIVY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="../vivyai.jks" \
            --signingKeyAlias="vivyai"

      # --------------------------------------------------
      # 15. Locate APK (robust, no hardcoded assumption)
      # --------------------------------------------------
      - name: Locate APK
        id: locate_apk
        run: |
          echo "All APK files found under android/:"
          find android -type f -name "*.apk" -print || true

          APK=""

          # 1. Standard Bubblewrap output name
          APK="$(find android -type f -name "app-release-signed.apk" -print -quit)"

          # 2. Any apk with both 'release' and 'signed' in the name
          if [ -z "$APK" ]; then
            APK="$(find android -type f -iname "*release*signed*.apk" -print -quit)"
          fi

          # 3. Any release apk that is explicitly not the unsigned variant
          if [ -z "$APK" ]; then
            APK="$(find android -type f -iname "*release*.apk" ! -iname "*unsigned*" -print -quit)"
          fi

          # 4. Last resort: any apk that isn't explicitly unsigned
          if [ -z "$APK" ]; then
            APK="$(find android -type f -iname "*.apk" ! -iname "*unsigned*" -print -quit)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: No signed APK could be located under android/."
            exit 1
          fi

          echo "Selected APK: $APK"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 16. Verify APK signature (apksigner, exactly 1 signer)
      # --------------------------------------------------
      - name: Verify APK signature
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi

          echo "Using apksigner at: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH" | tee apksigner_output.txt

          if ! grep -q "^Verified using v" apksigner_output.txt; then
            echo "ERROR: apksigner did not report a valid signature scheme."
            exit 1
          fi

          SIGNER_COUNT="$(grep -m1 -oE 'Number of signers: [0-9]+' apksigner_output.txt | grep -oE '[0-9]+')"

          if [ -z "$SIGNER_COUNT" ]; then
            echo "WARNING: Could not parse signer count from apksigner output; proceeding cautiously."
          elif [ "$SIGNER_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 signer, found $SIGNER_COUNT."
            exit 1
          else
            echo "Confirmed exactly 1 signer."
          fi

      # --------------------------------------------------
      # 17. Verify APK integrity, size, and manifest
      # --------------------------------------------------
      - name: Verify APK integrity
        run: |
          echo "Checking APK is not a zero-byte file..."
          test -s "$APK_PATH"

          echo "Testing APK ZIP integrity..."
          unzip -t "$APK_PATH" >/dev/null

          echo "Checking APK contains AndroidManifest.xml..."
          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml"

          case "$APK_PATH" in
            *unsigned*)
              echo "ERROR: Selected APK appears to be the unsigned build variant."
              exit 1
              ;;
          esac

          echo "APK integrity checks passed."

      # --------------------------------------------------
      # 18. Display APK information (best-effort package info)
      # --------------------------------------------------
      - name: APK information
        run: |
          echo "Final APK:"
          ls -lh "$APK_PATH"

          echo
          echo "APK SHA-256:"
          sha256sum "$APK_PATH"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          AAPT2="$BUILD_TOOLS/aapt2"

          echo
          if [ -x "$AAPT2" ]; then
            echo "Package info (aapt2):"
            "$AAPT2" dump badging "$APK_PATH" | head -20 || true
          else
            echo "aapt2 not found in build-tools, skipping package info dump."
          fi

      # --------------------------------------------------
      # 19. Upload APK artifact
      # --------------------------------------------------
      - name: Upload Vivy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Vivy-AI-installable-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
