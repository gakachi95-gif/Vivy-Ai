<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Chat — Vivy AI</title>
<meta name="theme-color" content="#8b5cf6">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>body{padding-bottom:0;}</style>
</head>
<body>

<div class="chat-wrap">
  <div class="chat-header">
    <button class="btn-icon" onclick="location.href='dashboard.html'"><span class="material-icons">arrow_back</span></button>
    <div style="flex:1;min-width:0;">
      <div id="chat-title" style="font-weight:700;font-size:0.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">New Chat</div>
      <div class="text-sm text-muted">Vivy AI Assistant</div>
    </div>
    <button class="btn-icon" id="pin-btn" title="Pin conversation" onclick="togglePin()"><span class="material-icons">push_pin</span></button>
    <button class="btn-icon" id="fav-btn" title="Favorite" onclick="toggleFavorite()"><span class="material-icons">favorite_border</span></button>
    <button class="btn-icon" id="more-btn" title="More options" onclick="toggleMoreMenu()"><span class="material-icons">more_vert</span></button>
  </div>

  <!-- Search + share/export bar -->
  <div id="more-menu" class="card" style="display:none;margin:10px 14px 0;">
    <input class="form-input mb-8" placeholder="Search this conversation..." oninput="searchInChat(this.value)">
    <div class="flex gap-8">
      <button class="btn btn-outline btn-sm" onclick="shareConversation()"><span class="material-icons" style="font-size:16px;">share</span> Share</button>
      <button class="btn btn-outline btn-sm" onclick="downloadAsTxt()"><span class="material-icons" style="font-size:16px;">description</span> TXT</button>
      <button class="btn btn-outline btn-sm" onclick="downloadAsPdf()"><span class="material-icons" style="font-size:16px;">picture_as_pdf</span> PDF</button>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages"></div>

  <form class="chat-input-bar" id="chat-form">
    <textarea id="chat-input" rows="1" placeholder="Message Vivy AI..." required></textarea>
    <button type="submit" class="send-btn" id="send-btn"><span class="material-icons">send</span></button>
  </form>
</div>

<!-- Bottom nav (mobile) -->
<nav class="bottom-nav">
  <a href="dashboard.html" data-nav-link><span class="material-icons">dashboard</span>Home</a>
  <a href="chat.html" data-nav-link class="active"><span class="material-icons">chat</span>Chat</a>
  <a href="writer.html" data-nav-link><span class="material-icons">edit_note</span>Writer</a>
  <a href="history.html" data-nav-link><span class="material-icons">history</span>History</a>
  <a href="settings.html" data-nav-link><span class="material-icons">settings</span>Settings</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="firebase-config.js"></script>
<script src="utils.js"></script>
<script src="auth.js"></script>
<script src="chat.js"></script>
<script>
  function toggleMoreMenu() {
    const el = document.getElementById("more-menu");
    el.style.display = el.style.display === "none" ? "block" : "none";
  }
</script>
</body>
</html>
